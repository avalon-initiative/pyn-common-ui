name: Release

# Pushing a v<X.Y.Z>[-title] tag (created by `make release`) publishes that
# exact version of @avalon-initiative/pyn-common-ui to the registry set in env below.
on:
  push:
    tags: ["v*"]

# The one place to change the registry: scope and URL for publishing.
env:
  NPM_REGISTRY: https://npm.pkg.github.com
  NPM_SCOPE: "@avalon-initiative"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to publish."
            exit 1
          fi

      - name: Verify tag matches package.json
        run: bash scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: ${{ env.NPM_SCOPE }}

      - name: Install dependencies
        run: npm ci

      - name: Checks
        run: bash scripts/release-checks.sh

      - name: Pack
        run: npm pack

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" ./*.tgz --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
